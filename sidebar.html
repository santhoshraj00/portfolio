  <i class="bi bi-list"></i>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
  <button id="close-btn">&times;</button>
  <ul class="sidebar-menu">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="parcours.html">Parcours scolaire</a></li>
    <li><a href="experiences.html">Expériences professionnelles</a></li>

    <li><a href="certifications.html">Certification</a></li>
    <li><a href="veille.html">Veille technologique</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</div>

<style>
  /* Sidebar style */
  .sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 1050;
    top: 0;
    left: 0;
    background-color: #0d6efd; /* bootstrap primary */
    overflow-x: hidden;
    transition: 0.3s;
    padding-top: 60px;
  }
  .sidebar-menu {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .sidebar-menu li {
    padding: 15px 20px;
  }
  .sidebar-menu li a {
    color: white;
    text-decoration: none;
    font-size: 1.2rem;
    display: block;
  }
  .sidebar-menu li a:hover {
    background-color: #0b5ed7; /* bootstrap primary darker */
  }
  #menu-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1100;
  }
  #close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 2rem;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
  }
</style>

<script>
  const sidebar = document.getElementById("sidebar");
  const menuBtn = document.getElementById("menu-btn");
  const closeBtn = document.getElementById("close-btn");

  menuBtn.onclick = () => {
    sidebar.style.width = "250px";
  };
  closeBtn.onclick = () => {
    sidebar.style.width = "0";
  };
</script>
